<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadPredictor</title>
  <meta name="description" content="Sales funnel calculator: turn a revenue target into the prospects, leads and customers a campaign needs." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h18l-7 8v7l-4 2v-9L3 4z" />
        </svg>
        <span class="brand__name">Lead<strong>Predictor</strong></span>
      </div>

      <form class="controls" id="controls" autocomplete="off">

        <label class="field">
          <span class="field__label" data-i18n="language">Language</span>
          <select class="field__input field__input--select" id="language" name="language">
            <option value="en">&#127482;&#127480; English</option>
            <option value="bg">&#127463;&#127468; Български</option>
            <option value="de">&#127465;&#127466; Deutsch</option>
            <option value="es">&#127466;&#127480; Español</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="currency">Currency</span>
          <select class="field__input field__input--select" id="currency" name="currency">
            <option value="USD">$ US Dollar</option>
            <option value="EUR">&euro; Euro</option>
            <option value="GBP">&pound; British Pound</option>
            <option value="BGN">лв. Bulgarian Lev</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="campaignStart">Campaign Start</span>
          <input class="field__input" type="date" id="start-date" name="start-date" required />
        </label>

        <label class="field">
          <span class="field__label" data-i18n="campaignEnd">Campaign End</span>
          <input class="field__input" type="date" id="end-date" name="end-date" required />
        </label>

        <label class="field">
          <span class="field__label" data-i18n="totalRevenue">Total Revenue</span>
          <span class="field__money">
            <span class="field__symbol" data-currency-symbol>$</span>
            <input class="field__input field__input--money" type="number" id="revenue"
                   name="revenue" min="0" step="100" value="10000" required />
          </span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="avgOrderValue">Avg. Order Value</span>
          <span class="field__money">
            <span class="field__symbol" data-currency-symbol>$</span>
            <input class="field__input field__input--money" type="number" id="order-value"
                   name="order-value" min="1" step="50" value="1000" required />
          </span>
        </label>

        <p class="controls__error" id="controls-error" role="alert" hidden></p>

      </form>
    </aside>

    <section class="workspace">
      <div class="workspace__top">
        <div class="panel chart-panel" id="chart-panel"></div>
      <div class="kpi-column" id="kpi-column">
        <article class="kpi" data-kpi="prospects">
          <header class="kpi__head">
            <svg class="kpi__icon" viewBox="0 0 21 21" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h3.7l1.6 2h6.7A1.5 1.5 0 0 1 18 8.5v7A1.5 1.5 0 0 1 16.5 17h-12A1.5 1.5 0 0 1 3 15.5v-9z"/></svg>
            <span class="kpi__name" data-i18n="prospects">Prospects</span>
            <span class="kpi__share" data-kpi-share>0%</span>
          </header>
          <p class="kpi__value" data-kpi-value>0</p>
          <div class="kpi__bar" role="presentation">
            <span class="kpi__bar-fill" data-kpi-bar style="width: 0%"></span>
          </div>
        </article>
        <article class="kpi" data-kpi="leads">
          <header class="kpi__head">
            <svg class="kpi__icon" viewBox="0 0 21 21" aria-hidden="true"><path d="M10.5 4a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4zM4 17.2c0-3.2 2.9-5.2 6.5-5.2s6.5 2 6.5 5.2v.3H4v-.3z"/></svg>
            <span class="kpi__name" data-i18n="leads">Leads</span>
            <span class="kpi__share" data-kpi-share>0%</span>
          </header>
          <p class="kpi__value" data-kpi-value>0</p>
          <div class="kpi__bar" role="presentation">
            <span class="kpi__bar-fill" data-kpi-bar style="width: 0%"></span>
          </div>
        </article>
        <article class="kpi" data-kpi="customers">
          <header class="kpi__head">
            <svg class="kpi__icon" viewBox="0 0 21 21" aria-hidden="true"><path d="M8.6 4a3.1 3.1 0 1 1 0 6.2 3.1 3.1 0 0 1 0-6.2zM2.6 17.2c0-3.1 2.7-5 6-5s6 1.9 6 5v.3h-12v-.3z"/></svg>
            <span class="kpi__name" data-i18n="customers">Customers</span>
            <span class="kpi__share" data-kpi-share>0%</span>
          </header>
          <p class="kpi__value" data-kpi-value>0</p>
          <div class="kpi__bar" role="presentation">
            <span class="kpi__bar-fill" data-kpi-bar style="width: 0%"></span>
          </div>
        </article>
      </div>
      </div>
      <div class="panel rates-panel" id="rates-panel">
        <div class="rate">
          <label class="rate__label" for="lead-rate" data-i18n="leadResponseRate">Lead Response Rate</label>
          <input class="rate__slider" type="range" id="lead-rate" name="lead-rate"
                 min="1" max="100" step="0.5" value="40" />
          <output class="rate__value" for="lead-rate" data-rate-output="lead-rate">40.00%</output>
        </div>
        <div class="rate">
          <label class="rate__label" for="prospect-rate" data-i18n="prospectResponseRate">Prospect Response Rate</label>
          <input class="rate__slider" type="range" id="prospect-rate" name="prospect-rate"
                 min="1" max="100" step="0.5" value="20" />
          <output class="rate__value" for="prospect-rate" data-rate-output="prospect-rate">20.00%</output>
        </div>
      </div>
    </section>

  </div>

  <script src="js/calculator.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
