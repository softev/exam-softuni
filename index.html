<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadPredictor</title>
  <meta name="description" content="Sales funnel calculator: turn a revenue target into the prospects, leads and customers a campaign needs." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h18l-7 8v7l-4 2v-9L3 4z" />
        </svg>
        <span class="brand__name">Lead<strong>Predictor</strong></span>
      </div>

      <form class="controls" id="controls" autocomplete="off">

        <label class="field">
          <span class="field__label" data-i18n="language">Language</span>
          <select class="field__input field__input--select" id="language" name="language">
            <option value="en">&#127482;&#127480; English</option>
            <option value="bg">&#127463;&#127468; Български</option>
            <option value="de">&#127465;&#127466; Deutsch</option>
            <option value="es">&#127466;&#127480; Español</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="currency">Currency</span>
          <select class="field__input field__input--select" id="currency" name="currency">
            <option value="USD">$ US Dollar</option>
            <option value="EUR">&euro; Euro</option>
            <option value="GBP">&pound; British Pound</option>
            <option value="BGN">лв. Bulgarian Lev</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="campaignStart">Campaign Start</span>
          <input class="field__input" type="date" id="start-date" name="start-date" required />
        </label>

        <label class="field">
          <span class="field__label" data-i18n="campaignEnd">Campaign End</span>
          <input class="field__input" type="date" id="end-date" name="end-date" required />
        </label>

        <label class="field">
          <span class="field__label" data-i18n="totalRevenue">Total Revenue</span>
          <span class="field__money">
            <span class="field__symbol" data-currency-symbol>$</span>
            <input class="field__input field__input--money" type="number" id="revenue"
                   name="revenue" min="0" step="100" value="10000" required />
          </span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="avgOrderValue">Avg. Order Value</span>
          <span class="field__money">
            <span class="field__symbol" data-currency-symbol>$</span>
            <input class="field__input field__input--money" type="number" id="order-value"
                   name="order-value" min="1" step="50" value="1000" required />
          </span>
        </label>

        <p class="controls__error" id="controls-error" role="alert" hidden></p>

      </form>
    </aside>

    <section class="workspace">
      <div class="workspace__top">
        <div class="panel chart-panel" id="chart-panel"></div>
        <div class="kpi-column" id="kpi-column"></div>
      </div>
      <div class="panel rates-panel" id="rates-panel"></div>
    </section>

  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
